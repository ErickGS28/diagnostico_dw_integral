{% extends 'peliculas/base.html' %}

{% block title %}Eliminar Película — CineApp{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card border-danger shadow-sm">
            <div class="card-header bg-danger text-white">
                <h4 class="mb-0">Confirmar eliminación</h4>
            </div>
            <div class="card-body text-center py-4">
                <p class="fs-5">¿Estás seguro de que deseas eliminar</p>
                <p class="fs-4 fw-bold">"{{ object.titulo }}"?</p>
                <p class="text-muted">Esta acción no se puede deshacer.</p>
                <form method="post" class="d-flex justify-content-center gap-3 mt-3">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger px-4">Sí, eliminar</button>
                    <a href="{% url 'pelicula-lista' %}" class="btn btn-secondary px-4">Cancelar</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
